name: Dependency Policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '57 6 * * *'
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  statuses: read
concurrency:
  group: dependency-policy
  cancel-in-progress: false
jobs:
  auto-merge:
    name: Apply dependency policy
    uses: nicodes/tools/.github/workflows/dependency-merge.yml@59a948943c2f7bdd782cad48ddfdabb106c80fbd # v0.27.5
    with:
      runner: ubuntu-24.04
